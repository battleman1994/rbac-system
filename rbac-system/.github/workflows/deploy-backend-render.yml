name: Deploy Backend to Render

on:
  push:
    branches: [ main ]
    paths:
      - 'springboot-backend/**'
      - '.github/workflows/deploy-backend-render.yml'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./springboot-backend

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Run tests
      run: mvn test

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest

    steps:
    - name: Trigger Render Deploy
      run: |
        echo "Triggering Render deployment..."
        curl -X POST ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      if: secrets.RENDER_DEPLOY_HOOK_URL != ''

    - name: Wait for deployment
      run: |
        echo "Waiting for Render deployment to complete..."
        echo "This may take 3-5 minutes"
        sleep 30
        echo "✅ Deploy triggered! Check Render dashboard for status."
