services:
  - type: web
    name: rbac-backend
    env: docker
    plan: free
    dockerfilePath: ./springboot-backend/Dockerfile
    dockerContext: ./springboot-backend
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        value: jdbc:h2:mem:rbacdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
      - key: SPRING_DATASOURCE_DRIVER_CLASS_NAME
        value: org.h2.Driver
      - key: SPRING_JPA_HIBERNATE_DDL_AUTO
        value: create-drop
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "86400000"
      - key: CORS_ALLOWED_ORIGINS
        value: https://rbac-system.vercel.app,https://*.vercel.app
    healthCheckPath: /actuator/health
    autoDeploy: true
